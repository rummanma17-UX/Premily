<!DOCTYPE html>
<html lang="en">
<head>
  <title>Account - Premily</title>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { gold: "#D4B375", deep: "#B8924B", dark: "#1E1916", muted: "#68605B", cream: "#FAF3E8" }, fontFamily: { serif: ["Cinzel", "serif"], sans: ["Plus Jakarta Sans", "sans-serif"] } } } }
  </script>
  <style>
    body { background: #F3EFE9; color: #1E1916; font-family: 'Plus Jakarta Sans', sans-serif; }
    .card { background: #fff; border: 1px solid #eadfcd; border-radius: 14px; }
  </style>
</head>
<body class="font-sans">

  <header class="bg-white border-b border-gold/30 py-4 px-4 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="../index.html" class="font-serif text-2xl font-bold tracking-widest text-dark">PREMILY<span class="text-deep">.</span></a>
      <span class="text-xs text-muted">Customer Account</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <div class="card p-6 space-y-4">
      <h2 class="font-bold text-lg border-b border-gold/20 pb-2">Active Orders & Tracking</h2>
      <div class="border border-gold/30 rounded-xl p-4 bg-cream/30 text-xs space-y-3">
        <div class="flex justify-between items-center border-b border-gold/20 pb-2">
          <b>Order #PRM-8942</b>
          <span class="bg-amber-100 text-amber-800 font-semibold px-2.5 py-1 rounded-full">In Transit</span>
        </div>
        <p class="text-muted">Estimated delivery to Sylhet: 1-2 days</p>
      </div>
    </div>
  </main>

  <script>lucide.createIcons();</script>
</body>
</html>
