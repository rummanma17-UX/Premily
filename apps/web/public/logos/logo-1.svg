<svg class="premily-logo-a" viewBox="65 50 285 92" height="40" role="img" aria-label="Premily" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .premily-logo-a{display:block;width:auto;height:40px;max-width:100%;overflow:hidden}
    .premily-logo-a .bag{transform-box:fill-box;transform-origin:50% 100%;animation:pa-pop .8s cubic-bezier(.3,1.2,.5,1) both}
    .premily-logo-a .hd{transform-box:fill-box;transform-origin:50% 100%;animation:pa-swing .9s .75s ease-in-out}
    .premily-logo-a .draw{stroke-dasharray:1 1;animation:pa-draw .4s 1s ease-out both}
    .premily-logo-a .word{fill:#1E1916;stroke:#B8924B;stroke-width:1.4;stroke-dasharray:500;animation:pa-outline 1s 1.2s ease-in-out both,pa-fill .5s 2.05s ease-out both}
    .premily-logo-a .sp{transform-box:fill-box;transform-origin:center}
    .premily-logo-a .sp1{animation:pa-s1 1.1s 1.35s ease-out both}
    .premily-logo-a .sp2{animation:pa-s2 1.1s 1.5s ease-out both}
    .premily-logo-a .sp3{animation:pa-s3 1.1s 1.65s ease-out both}
    .premily-logo-a .sp4{animation:pa-s4 1.1s 1.8s ease-out both}
    @keyframes pa-pop{0%{transform:scale(.2);opacity:0}45%{transform:scale(1.12,.88);opacity:1}72%{transform:scale(.96,1.06)}100%{transform:scale(1);opacity:1}}
    @keyframes pa-swing{0%{transform:rotate(0)}25%{transform:rotate(-16deg)}55%{transform:rotate(11deg)}80%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
    @keyframes pa-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
    @keyframes pa-outline{from{stroke-dashoffset:500}to{stroke-dashoffset:0}}
    @keyframes pa-fill{from{fill:transparent;stroke-opacity:1}to{fill:#1E1916;stroke-opacity:0}}
    @keyframes pa-s1{0%{transform:translate(0,0) scale(0) rotate(0);opacity:1}30%{transform:translate(-13.6px,-10.4px) scale(1) rotate(40deg)}100%{transform:translate(-34px,-26px) scale(.2) rotate(140deg);opacity:0}}
    @keyframes pa-s2{0%{transform:translate(0,0) scale(0) rotate(0);opacity:1}30%{transform:translate(-3.2px,-16px) scale(1) rotate(40deg)}100%{transform:translate(-8px,-40px) scale(.2) rotate(140deg);opacity:0}}
    @keyframes pa-s3{0%{transform:translate(0,0) scale(0) rotate(0);opacity:1}30%{transform:translate(8.8px,-13.6px) scale(1) rotate(40deg)}100%{transform:translate(22px,-34px) scale(.2) rotate(140deg);opacity:0}}
    @keyframes pa-s4{0%{transform:translate(0,0) scale(0) rotate(0);opacity:1}30%{transform:translate(18.4px,-6.4px) scale(1) rotate(40deg)}100%{transform:translate(46px,-16px) scale(.2) rotate(140deg);opacity:0}}
    @media (prefers-reduced-motion:reduce){.premily-logo-a *{animation:none!important}.premily-logo-a .sp{display:none}.premily-logo-a .word{stroke:none}}
  </style>
  <g class="bag">
    <rect x="70" y="80" width="12" height="45" rx="2" fill="#1E1916"/>
    <rect x="70" y="80" width="46" height="34" rx="15" fill="#1E1916"/>
    <path class="hd" d="M85 81C85 61 101 61 101 81" fill="none" stroke="#1E1916" stroke-width="4" stroke-linecap="round"/>
    <path class="draw" pathLength="1" d="M85 94Q93 104 101 94" fill="none" stroke="#D4B375" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <g transform="translate(93 68)">
    <path class="sp sp1" fill="#D4B375" d="M0-6 1.6-1.6 6 0 1.6 1.6 0 6-1.6 1.6-6 0-1.6-1.6Z"/>
    <path class="sp sp2" fill="#B8924B" d="M0-6 1.6-1.6 6 0 1.6 1.6 0 6-1.6 1.6-6 0-1.6-1.6Z"/>
    <path class="sp sp3" fill="#D4B375" d="M0-6 1.6-1.6 6 0 1.6 1.6 0 6-1.6 1.6-6 0-1.6-1.6Z"/>
    <path class="sp sp4" fill="#B8924B" d="M0-6 1.6-1.6 6 0 1.6 1.6 0 6-1.6 1.6-6 0-1.6-1.6Z"/>
  </g>
