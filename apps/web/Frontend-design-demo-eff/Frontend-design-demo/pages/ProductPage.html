<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Curved Lounge Chair - Premily</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { gold: "#D4B375", deep: "#B8924B", dark: "#1E1916", muted: "#68605B", cream: "#FAF3E8" },
          fontFamily: { serif: ["Cinzel", "serif"], sans: ["Plus Jakarta Sans", "sans-serif"] }
        }
      }
    }
  </script>
  <style>
    body { background: #F3EFE9; color: #1E1916; font-family: 'Plus Jakarta Sans', sans-serif; }
    .gbtn { background: linear-gradient(135deg,#E3C793,#B8924B); color: #1E1916; font-weight: 600; }
    .card { background: #fff; border: 1px solid #eadfcd; border-radius: 14px; }
  </style>
</head>
<body class="font-sans">

  <header class="bg-white border-b border-gold/30 py-4 px-4 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="../index.html" class="font-serif text-2xl font-bold tracking-widest text-dark">PREMILY<span class="text-deep">.</span></a>
      <a href="catalog.html" class="text-xs text-muted font-medium hover:text-deep">← Back to Catalog</a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <div class="grid md:grid-cols-2 gap-8">
      <div class="card p-2 overflow-hidden">
        <img src="https://images.unsplash.com/photo-1517256064527-09c73fc73e38?auto=format&fit=crop&w=800&q=80" class="w-full h-96 object-cover rounded-xl">
      </div>
      <div class="space-y-6">
        <div>
          <span class="text-xs font-semibold text-deep uppercase tracking-widest">Premily Mart</span>
          <h1 class="text-2xl font-bold text-dark mt-1">Aura Curved Lounge Chair</h1>
          <p class="text-xs text-muted mt-1">★ 4.9 · 312 sold · In Stock</p>
        </div>
        <div class="text-2xl font-bold text-deep">৳18,500 <span class="text-xs text-muted line-through font-normal">৳24,000</span></div>
        <p class="text-xs text-muted leading-relaxed">Handcrafted ergonomic curved lounge chair upholstered in premium beige fabric with reinforced hardwood frame and gold accents.</p>

        <!-- Variants -->
        <div class="space-y-2">
          <label class="text-xs font-bold text-dark block">Color Variant</label>
          <div class="flex gap-2">
            <button class="px-3 py-1.5 border-2 border-deep rounded-lg text-xs font-semibold bg-cream/50">Warm Beige</button>
            <button class="px-3 py-1.5 border border-gold/40 rounded-lg text-xs text-muted hover:border-deep">Obsidian Dark</button>
            <button class="px-3 py-1.5 border border-gold/40 rounded-lg text-xs text-muted hover:border-deep">Royal Cream</button>
          </div>
        </div>

        <div class="flex gap-4 pt-2">
          <a href="checkout.html" class="gbtn flex-1 py-3.5 text-center rounded-xl text-xs font-bold uppercase tracking-wider shadow-md">Buy Now</a>
          <button class="p-3.5 border border-gold/40 rounded-xl hover:border-deep text-dark"><i data-lucide="heart" class="w-5 h-5"></i></button>
        </div>
      </div>
    </div>
  </main>

  <script>lucide.createIcons();</script>
</body>
</html>
