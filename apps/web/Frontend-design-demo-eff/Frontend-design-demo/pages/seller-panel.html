<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Dashboard - Premily</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { gold: "#D4B375", deep: "#B8924B", dark: "#1E1916", muted: "#68605B", cream: "#FAF3E8" },
          fontFamily: { serif: ["Cinzel", "serif"], sans: ["Plus Jakarta Sans", "sans-serif"] }
        }
      }
    }
  </script>
  <style>
    body { background: #F3EFE9; color: #1E1916; font-family: 'Plus Jakarta Sans', sans-serif; }
    .gbtn { background: linear-gradient(135deg,#E3C793,#B8924B); color: #1E1916; font-weight: 600; }
    .card { background: #fff; border: 1px solid #eadfcd; border-radius: 14px; }
  </style>
</head>
<body class="font-sans">

  <header class="bg-white border-b border-gold/30 py-4 px-6 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="../index.html" class="font-serif text-2xl font-bold tracking-widest text-dark">PREMILY<span class="text-deep">.</span></a>
      <span class="text-xs font-bold text-deep flex items-center gap-1.5"><i data-lucide="store" class="w-4 h-4"></i> Vendor Merchant Portal</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8 space-y-6">
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
      <div class="card p-5 space-y-1">
        <span class="text-xs text-muted block">Store Sales</span>
        <b class="text-2xl text-deep">৳340,500</b>
      </div>
      <div class="card p-5 space-y-1">
        <span class="text-xs text-muted block">Active Products</span>
        <b class="text-2xl text-dark">14 Items</b>
      </div>
      <div class="card p-5 space-y-1">
        <span class="text-xs text-muted block">Fulfillment Rate</span>
        <b class="text-2xl text-emerald-700">99.2%</b>
      </div>
    </div>

    <div class="card p-6 space-y-4">
      <div class="flex justify-between items-center border-b border-gold/20 pb-3">
        <h2 class="font-bold text-base text-dark">Your Inventory</h2>
        <button class="gbtn px-4 py-2 rounded-lg text-xs font-bold">+ Add New Product</button>
      </div>
      <div class="space-y-3 text-xs">
        <div class="flex items-center justify-between p-3 border border-gold/20 rounded-xl">
          <div class="flex items-center gap-3">
            <img src="https://images.unsplash.com/photo-1517256064527-09c73fc73e38?auto=format&fit=crop&w=100&q=80" class="w-10 h-10 rounded-lg object-cover">
            <div>
              <b class="block text-dark">Aura Curved Lounge Chair</b>
              <span class="text-muted">Stock: 24 units · Price: ৳18,500</span>
            </div>
          </div>
          <span class="bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-semibold">Active</span>
        </div>
      </div>
    </div>
  </main>

  <script>lucide.createIcons();</script>
</body>
</html>
