<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Premily</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { gold: "#D4B375", deep: "#B8924B", dark: "#1E1916", muted: "#68605B", cream: "#FAF3E8" }, fontFamily: { serif: ["Cinzel", "serif"], sans: ["Plus Jakarta Sans", "sans-serif"] } } } }
  </script>
  <style>
    body { background: #F3EFE9; color: #1E1916; font-family: 'Plus Jakarta Sans', sans-serif; }
    .gbtn { background: linear-gradient(135deg,#E3C793,#B8924B); color: #1E1916; font-weight: 600; }
    .card { background: #fff; border: 1px solid #eadfcd; border-radius: 14px; }
  </style>
</head>
<body class="font-sans">

  <header class="bg-white border-b border-gold/30 py-4 px-4 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="../index.html" class="font-serif text-2xl font-bold tracking-widest text-dark">PREMILY<span class="text-deep">.</span></a>
      <span class="text-xs text-muted flex items-center gap-1"><i data-lucide="shield-check" class="w-4 h-4 text-emerald-600"></i> Secure Checkout</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <div class="grid lg:grid-cols-[1fr_380px] gap-6">
      <div class="space-y-4">
        <div class="card p-6 space-y-4">
          <h2 class="font-bold text-base border-b border-gold/20 pb-2 flex items-center gap-2">
            <i data-lucide="map-pin" class="w-5 h-5 text-deep"></i> Shipping Address
          </h2>
          <div class="grid sm:grid-cols-2 gap-3 text-xs">
            <div>
              <label class="font-semibold text-muted">Full Name</label>
              <input type="text" value="Abdullah Al Rumman" class="w-full border border-gold/40 rounded-lg p-2.5 outline-none mt-1">
            </div>
            <div>
              <label class="font-semibold text-muted">Phone Number</label>
              <input type="text" value="01700000000" class="w-full border border-gold/40 rounded-lg p-2.5 outline-none mt-1">
            </div>
            <div class="sm:col-span-2">
              <label class="font-semibold text-muted">District</label>
              <select class="w-full border border-gold/40 rounded-lg p-2.5 outline-none mt-1 bg-white">
                <option selected>Sylhet</option>
                <option>Sunamganj</option>
                <option>Dhaka</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="card p-6 space-y-4 h-fit">
        <h2 class="font-bold text-base border-b border-gold/20 pb-2">Order Summary</h2>
        <div class="flex justify-between text-sm font-bold pt-2 border-t border-gold/30">
          <span>Total</span><span class="text-deep">৳18,100</span>
        </div>
        <button class="gbtn w-full py-3 rounded-xl text-xs uppercase tracking-wider font-bold">Place Order</button>
      </div>
    </div>
  </main>

  <script>lucide.createIcons();</script>
</body>
</html>
