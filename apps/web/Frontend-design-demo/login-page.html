<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login / Sign Up - Premily</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.383.0"></script>
  <script>
    tailwind.config={theme:{extend:{colors:{gold:"#D4B375",deep:"#B8924B",dark:"#1E1916",muted:"#68605B",cream:"#FAF3E8"},fontFamily:{serif:["Cinzel"],sans:["Plus Jakarta Sans"]}}}}
  </script>
  <style>
    body{background:#F3EFE9;color:#1E1916}
    .gbtn{background:linear-gradient(135deg,#E3C793,#B8924B);color:#1E1916;font-weight:600}
    .gbtn:hover{filter:brightness(1.06)}
    .card{background:#fff;border:1px solid #eadfcd;border-radius:16px;box-shadow:0 12px 28px -12px rgba(184,146,75,.25)}
    .tab-btn{font-weight:600;font-size:14px;color:#68605B;border-bottom:2px solid transparent;padding-bottom:8px;cursor:pointer;transition:.2s}
    .tab-btn.active{color:#B8924B;border-color:#B8924B}
  </style>
</head>
<body class="font-sans min-h-screen flex flex-col justify-between">

  <!-- Top Simple Bar -->
  <div class="bg-dark text-cream text-xs">
    <div class="max-w-7xl mx-auto px-4 py-2 flex justify-between items-center">
      <a href="#" class="font-serif text-lg tracking-widest text-cream">PREMILY<span class="text-gold">.</span></a>
      <div class="flex items-center gap-4">
        <span class="hover:text-gold cursor-pointer flex items-center gap-1"><i data-lucide="help-circle" class="w-3.5 h-3.5"></i>Help & Support</span>
        <span class="border border-gold/60 rounded-full px-3 py-0.5 hover:bg-gold hover:text-dark cursor-pointer flex items-center gap-1">
          <i data-lucide="languages" class="w-3.5 h-3.5"></i>বাংলা
        </span>
      </div>
    </div>
  </div>

  <!-- Main Auth Container -->
  <main class="flex-1 flex items-center justify-center px-4 py-8">
    <div class="card w-full max-w-md p-6 sm:p-8 space-y-6">
      
      <!-- Brand Header inside card -->
      <div class="text-center space-y-1">
        <h1 class="font-serif text-2xl font-bold tracking-widest text-dark">PREMILY<span class="text-deep">.</span></h1>
        <p class="text-xs text-muted">Architectural luxury living, delivered to your doorstep.</p>
      </div>

      <!-- Tab Switcher (Login / Register) -->
      <div class="flex border-b border-gold/30 justify-around">
        <button id="btn-login-tab" class="tab-btn active w-1/2 text-center" onclick="switchAuthTab('login')">Login</button>
        <button id="btn-signup-tab" class="tab-btn w-1/2 text-center" onclick="switchAuthTab('signup')">Create Account</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="form-login" class="space-y-4" onsubmit="event.preventDefault();">
        <div class="space-y-1">
          <label class="text-xs font-semibold text-muted">Phone Number or Email</label>
          <div class="flex items-center border border-gold/40 rounded-xl px-3 py-2.5 focus-within:border-deep bg-white">
            <i data-lucide="mail" class="w-4 h-4 text-muted mr-2"></i>
            <input type="text" class="w-full text-sm outline-none bg-transparent" placeholder="Enter your email or phone">
          </div>
        </div>

        <div class="space-y-1">
          <div class="flex justify-between items-center text-xs">
            <span class="font-semibold text-muted">Password</span>
            <a href="#" class="text-deep hover:underline">Forgot password?</a>
          </div>
          <div class="flex items-center border border-gold/40 rounded-xl px-3 py-2.5 focus-within:border-deep bg-white">
            <i data-lucide="lock" class="w-4 h-4 text-muted mr-2"></i>
            <input type="password" class="w-full text-sm outline-none bg-transparent" placeholder="••••••••">
            <i data-lucide="eye" class="w-4 h-4 text-muted cursor-pointer hover:text-dark"></i>
          </div>
        </div>

        <button type="submit" class="gbtn w-full py-3 rounded-xl text-sm uppercase tracking-wide shadow-sm mt-2">
          Sign In
        </button>
      </form>

      <!-- SIGN UP FORM (Hidden by default) -->
      <form id="form-signup" class="space-y-4 hidden" onsubmit="event.preventDefault();">
        <div class="space-y-1">
          <label class="text-xs font-semibold text-muted">Full Name</label>
          <div class="flex items-center border border-gold/40 rounded-xl px-3 py-2.5 focus-within:border-deep bg-white">
            <i data-lucide="user" class="w-4 h-4 text-muted mr-2"></i>
            <input type="text" class="w-full text-sm outline-none bg-transparent" placeholder="Abdullah Al Rumman">
          </div>
        </div>

        <div class="space-y-1">
          <label class="text-xs font-semibold text-muted">Phone Number or Email</label>
          <div class="flex items-center border border-gold/40 rounded-xl px-3 py-2.5 focus-within:border-deep bg-white">
            <i data-lucide="mail" class="w-4 h-4 text-muted mr-2"></i>
            <input type="text" class="w-full text-sm outline-none bg-transparent" placeholder="name@example.com or 017xxxxxxxx">
          </div>
        </div>

        <div class="space-y-1">
          <label class="text-xs font-semibold text-muted">Create Password</label>
          <div class="flex items-center border border-gold/40 rounded-xl px-3 py-2.5 focus-within:border-deep bg-white">
            <i data-lucide="lock" class="w-4 h-4 text-muted mr-2"></i>
            <input type="password" class="w-full text-sm outline-none bg-transparent" placeholder="At least 6 characters">
          </div>
        </div>

        <button type="submit" class="gbtn w-full py-3 rounded-xl text-sm uppercase tracking-wide shadow-sm mt-2">
          Create Account
        </button>
      </form>

      <!-- Divider -->
      <div class="relative flex py-2 items-center">
        <div class="grow border-t border-gold/30"></div>
        <span class="shrink mx-4 text-xs text-muted uppercase">Or connect with</span>
        <div class="grow border-t border-gold/30"></div>
      </div>

      <!-- Social Login Buttons -->
      <div class="grid grid-cols-2 gap-3">
        <button class="flex items-center justify-center gap-2 border border-gold/40 rounded-xl py-2.5 text-xs font-semibold hover:bg-cream transition-all">
          <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.15 21.32 7.22 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.18C.43 8.12 0 9.82 0 12s.43 3.88 1.18 5.4l4.09-3.16z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.15 2.68 1.18 6.6l4.09 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
          Google
        </button>
        <button class="flex items-center justify-center gap-2 border border-gold/40 rounded-xl py-2.5 text-xs font-semibold hover:bg-cream transition-all">
          <svg class="w-4 h-4 fill-current text-blue-600" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Facebook
        </button>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-cream/60 text-center text-xs py-4">
    © 2026 Premily · Architectural Luxury Living
  </footer>

  <script>
    lucide.createIcons();
    function switchAuthTab(tab) {
      const loginBtn = document.getElementById('btn-login-tab');
      const signupBtn = document.getElementById('btn-signup-tab');
      const loginForm = document.getElementById('form-login');
      const signupForm = document.getElementById('form-signup');

      if (tab === 'login') {
        loginBtn.classList.add('active');
        signupBtn.classList.remove('active');
        loginForm.classList.remove('hidden');
        signupForm.classList.add('hidden');
      } else {
        signupBtn.classList.add('active');
        loginBtn.classList.remove('active');
        signupForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
