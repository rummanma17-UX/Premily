  <style>
    .premily-logo-b{display:block;width:auto;height:40px;max-width:100%;overflow:hidden}
    .plb-ink{fill:#1E1916}
    .plb-handle{fill:none;stroke:#D4B375;stroke-width:3.6;stroke-linecap:round}
    .plb-smile{fill:none;stroke:#D4B375;stroke-width:3.6;stroke-linecap:round}
    .plb-ring{fill:none;stroke:#D4B375;stroke-width:2}
    .plb-dot{fill:#B8924B}
    .plb-bag{transform-box:fill-box;transform-origin:50% 100%;animation:plb-stamp .55s cubic-bezier(.3,1.3,.5,1) both}
    .plb-ring{transform-box:fill-box;transform-origin:center;animation:plb-ring .7s .35s ease-out both}
    .plb-handle{transform-box:fill-box;transform-origin:50% 100%;animation:plb-swing .8s .55s ease-in-out}
    .plb-smile{stroke-dasharray:1 1;animation:plb-draw .4s .55s ease-out both}
    .plb-wipe{transform-box:fill-box;transform-origin:0 50%;animation:plb-wipe .7s .55s cubic-bezier(.6,0,.2,1) both}
    .plb-text{animation:plb-slide .7s .55s ease-out both}
    .plb-sheen{animation:plb-sheen .9s 1.35s ease-in-out both}
    @keyframes plb-stamp{0%{transform:scale(1.7);opacity:0}55%{transform:scale(.93);opacity:1}78%{transform:scale(1.04)}100%{transform:none;opacity:1}}
    @keyframes plb-ring{from{transform:scale(.2);opacity:.9}to{transform:scale(1.15);opacity:0}}
    @keyframes plb-swing{0%{transform:rotate(0)}25%{transform:rotate(-16deg)}55%{transform:rotate(11deg)}80%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
    @keyframes plb-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
    @keyframes plb-wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes plb-slide{from{transform:translateX(-24px)}to{transform:none}}
    @keyframes plb-sheen{from{transform:translateX(0) skewX(-20deg)}to{transform:translateX(420px) skewX(-20deg)}}
    @media (prefers-reduced-motion:reduce){.premily-logo-b *{animation:none!important}.plb-ring,.plb-sheen{display:none}.plb-wipe{transform:none}}
  </style>
