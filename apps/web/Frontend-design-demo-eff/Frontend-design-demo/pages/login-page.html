<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Premily</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { gold: "#D4B375", deep: "#B8924B", dark: "#1E1916", muted: "#68605B", cream: "#FAF3E8" },
          fontFamily: { serif: ["Cinzel", "serif"], sans: ["Plus Jakarta Sans", "sans-serif"] }
        }
      }
    }
  </script>
  <style>
    body { background: #FAF3E8; color: #1E1916; font-family: 'Plus Jakarta Sans', sans-serif; }
    .gbtn { background: linear-gradient(135deg,#E3C793,#B8924B); color: #1E1916; font-weight: 600; }
    .card { background: #fff; border: 1px solid #eadfcd; border-radius: 14px; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="card p-8 max-w-sm w-full space-y-6 shadow-md">
    <div class="text-center space-y-1">
      <a href="../index.html" class="font-serif text-2xl font-bold tracking-widest text-dark block">PREMILY<span class="text-deep">.</span></a>
      <p class="text-xs text-muted">Sign in to your luxury account</p>
    </div>

    <form class="space-y-4 text-xs">
      <div>
        <label class="font-semibold text-muted">Phone or Email</label>
        <input type="text" placeholder="017... or email@domain.com" class="w-full border border-gold/40 rounded-lg p-2.5 outline-none mt-1 focus:border-deep">
      </div>
      <div>
        <label class="font-semibold text-muted">Password</label>
        <input type="password" placeholder="••••••••" class="w-full border border-gold/40 rounded-lg p-2.5 outline-none mt-1 focus:border-deep">
      </div>
      <button type="button" onclick="window.location.href='../index.html'" class="gbtn w-full py-3 rounded-xl text-xs font-bold uppercase tracking-wider shadow">Sign In</button>
    </form>
    <div class="text-center text-[11px] text-muted">
      Don't have an account? <a href="#" class="text-deep font-semibold underline">Register</a>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
