<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalog - Premily</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { gold: "#D4B375", deep: "#B8924B", dark: "#1E1916", muted: "#68605B", cream: "#FAF3E8" }, fontFamily: { serif: ["Cinzel", "serif"], sans: ["Plus Jakarta Sans", "sans-serif"] } } } }
  </script>
  <style>
    body { background: #F3EFE9; color: #1E1916; font-family: 'Plus Jakarta Sans', sans-serif; }
    .card { background: #fff; border: 1px solid #eadfcd; border-radius: 14px; }
  </style>
</head>
<body class="font-sans">

  <header class="bg-white border-b border-gold/30 py-4 px-4 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="../index.html" class="font-serif text-2xl font-bold tracking-widest text-dark">PREMILY<span class="text-deep">.</span></a>
      <span class="text-xs text-muted font-medium">Product Catalog</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-4">
    <div class="grid lg:grid-cols-[240px_1fr] gap-6">
      <aside class="card p-4 space-y-4 h-fit">
        <b class="text-sm block border-b border-gold/30 pb-2">Filter Products</b>
        <div class="space-y-2 text-xs">
          <b class="block text-muted">Category</b>
          <label class="flex items-center gap-2"><input type="checkbox" checked class="accent-deep"> Furniture</label>
          <label class="flex items-center gap-2"><input type="checkbox" class="accent-deep"> Lighting</label>
          <label class="flex items-center gap-2"><input type="checkbox" class="accent-deep"> Decor</label>
        </div>
      </aside>

      <div class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-4">
        <a href="ProductPage.html" class="card overflow-hidden block hover:border-deep transition">
          <div class="relative aspect-[4/3] bg-gray-100">
            <img src="https://images.unsplash.com/photo-1517256064527-09c73fc73e38?auto=format&fit=crop&w=600&q=80" class="w-full h-full object-cover">
            <span class="absolute top-2 left-2 bg-[#E3C793] text-dark text-[11px] font-semibold italic px-2 py-0.5 rounded-full">-23%</span>
          </div>
          <div class="p-3 space-y-1">
            <h3 class="text-xs font-medium text-dark truncate">Aura Curved Lounge Chair</h3>
            <div class="flex items-baseline gap-2">
              <span class="text-sm font-bold text-deep">৳18,500</span>
              <span class="text-xs text-muted line-through">৳24,000</span>
            </div>
            <div class="flex items-center gap-1 pt-1">
              <span class="bg-dark text-[#E3C793] text-[9px] px-1.5 py-0.5 rounded italic">Mart</span>
              <span class="bg-emerald-50 text-emerald-700 border border-emerald-200 text-[9px] px-1.5 py-0.5 rounded italic">✓Verified</span>
            </div>
          </div>
        </a>
      </div>
    </div>
  </main>

  <script>lucide.createIcons();</script>
</body>
</html>
