<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card Component - Premily</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { gold: "#D4B375", deep: "#B8924B", dark: "#1E1916", muted: "#68605B", cream: "#FAF3E8" }, fontFamily: { serif: ["Cinzel", "serif"], sans: ["Plus Jakarta Sans", "sans-serif"] } } } }
  </script>
  <style>
    body { background: #FAF3E8; color: #1E1916; font-family: 'Plus Jakarta Sans', sans-serif; }
    .card { background: #fff; border: 1px solid #eadfcd; border-radius: 16px; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-[240px] card overflow-hidden shadow-sm hover:shadow-md transition-shadow">
    <div class="relative w-full aspect-[4/3] overflow-hidden bg-gray-100">
      <img src="https://images.unsplash.com/photo-1517256064527-09c73fc73e38?auto=format&fit=crop&w=600&q=80" class="w-full h-full object-cover">
      <span class="absolute top-2.5 left-2.5 bg-[#E3C793] text-dark text-[11px] font-semibold italic px-2 py-0.5 rounded-full shadow-sm">-23%</span>
    </div>
    <div class="p-3 flex flex-col gap-1.5">
      <h3 class="text-xs sm:text-sm font-medium text-dark line-clamp-1">Aura Curved Lounge Chair</h3>
      <div class="flex items-baseline gap-2">
        <span class="text-sm sm:text-base font-bold text-[#B8924B]">৳18,500</span>
        <span class="text-xs text-muted line-through">৳24,000</span>
      </div>
      <div class="flex items-center gap-1.5 pt-0.5">
        <span class="bg-dark text-[#E3C793] text-[10px] font-semibold italic px-2 py-0.5 rounded">Mart</span>
        <span class="bg-[#ECFDF5] text-[#047857] border border-[#A7F3D0] text-[10px] font-semibold italic px-2 py-0.5 rounded flex items-center gap-0.5">✓Verified</span>
      </div>
      <div class="text-[11px] text-muted pt-0.5">★ 4.9 · 312 sold</div>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
