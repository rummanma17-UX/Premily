<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Checkout - Premily</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.383.0"></script>
  <script>
    tailwind.config={theme:{extend:{colors:{gold:"#D4B375",deep:"#B8924B",dark:"#1E1916",muted:"#68605B",cream:"#FAF3E8"},fontFamily:{serif:["Cinzel"],sans:["Plus Jakarta Sans"]}}}}
  </script>
  <style>
    body{background:#F3EFE9;color:#1E1916}
    .gbtn{background:linear-gradient(135deg,#E3C793,#B8924B);color:#1E1916;font-weight:600}
    .card{background:#fff;border:1px solid #eadfcd;border-radius:14px}
  </style>
</head>
<body class="font-sans">

  <header class="bg-white border-b border-gold/30 py-4 px-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <span class="font-serif text-2xl font-bold tracking-widest text-dark">PREMILY<span class="text-deep">.</span></span>
      <span class="text-xs text-muted">Secure Checkout</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <div class="grid lg:grid-cols-[1fr_360px] gap-6">
      
      <!-- Left Column: Shipping & Payment Form -->
      <div class="space-y-4">
        <!-- Delivery Address Card -->
        <div class="card p-4 sm:p-6 space-y-4">
          <h2 class="font-bold text-lg border-b border-gold/20 pb-2 flex items-center gap-2">
            <i data-lucide="map-pin" class="w-5 h-5 text-deep"></i> Shipping Address
          </h2>
          
          <div class="grid sm:grid-cols-2 gap-3 text-xs">
            <div class="space-y-1">
              <label class="font-semibold text-muted">Full Name</label>
              <input type="text" value="Abdullah Al Rumman" class="w-full border border-gold/40 rounded-lg p-2.5 outline-none bg-white">
            </div>
            <div class="space-y-1">
              <label class="font-semibold text-muted">Phone Number</label>
              <input type="text" value="01700000000" class="w-full border border-gold/40 rounded-lg p-2.5 outline-none bg-white">
            </div>
            <div class="space-y-1 sm:col-span-2">
              <label class="font-semibold text-muted">Street Address</label>
              <input type="text" placeholder="House no, road name, area" class="w-full border border-gold/40 rounded-lg p-2.5 outline-none bg-white">
            </div>
            <div class="space-y-1">
              <label class="font-semibold text-muted">District</label>
              <select class="w-full border border-gold/40 rounded-lg p-2.5 outline-none bg-white">
                <option>Dhaka</option>
                <option selected>Sylhet</option>
                <option>Chattogram</option>
                <option>Gazipur</option>
              </select>
            </div>
            <div class="space-y-1">
              <label class="font-semibold text-muted">City / Thana</label>
              <input type="text" value="Chhatak" class="w-full border border-gold/40 rounded-lg p-2.5 outline-none bg-white">
            </div>
          </div>
        </div>

        <!-- Payment Method Selection Card -->
        <div class="card p-4 sm:p-6 space-y-4">
          <h2 class="font-bold text-lg border-b border-gold/20 pb-2 flex items-center gap-2">
            <i data-lucide="credit-card" class="w-5 h-5 text-deep"></i> Payment Method
          </h2>

          <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 text-xs">
            <label class="card p-3 flex flex-col items-center gap-1 cursor-pointer border-2 border-deep bg-cream/40">
              <input type="radio" name="pay" checked class="accent-deep">
              <b class="mt-1">bKash / Nagad</b>
              <span class="text-[10px] text-muted">Instant MFS</span>
            </label>
            <label class="card p-3 flex flex-col items-center gap-1 cursor-pointer hover:bg-cream/20">
              <input type="radio" name="pay" class="accent-deep">
              <b class="mt-1">Cash on Delivery</b>
              <span class="text-[10px] text-muted">Pay at doorstep</span>
            </label>
            <label class="card p-3 flex flex-col items-center gap-1 cursor-pointer hover:bg-cream/20">
              <input type="radio" name="pay" class="accent-deep">
              <b class="mt-1">Card Payment</b>
              <span class="text-[10px] text-muted">Visa / Mastercard</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Right Column: Order Summary Sidebar -->
      <div class="space-y-4">
        <div class="card p-4 sm:p-6 space-y-4">
          <h2 class="font-bold text-lg border-b border-gold/20 pb-2">Order Summary</h2>

          <!-- Item list -->
          <div class="space-y-3 border-b border-gold/20 pb-3 text-xs">
            <div class="flex gap-3">
              <img src="https://picsum.photos/id/1060/100/100" class="w-12 h-12 rounded object-cover">
              <div class="flex-1">
                <b class="block truncate">Aura Curved Lounge Chair</b>
                <span class="text-muted">Color: Beige · Qty: 1</span>
              </div>
              <b class="text-deep">৳18,500</b>
            </div>
          </div>

          <!-- Price calculations -->
          <div class="space-y-1.5 text-xs text-muted">
            <div class="flex justify-between"><span>Subtotal</span><b class="text-dark">৳18,500</b></div>
            <div class="flex justify-between"><span>Delivery Fee (Sylhet)</span><b class="text-dark">৳100</b></div>
            <div class="flex justify-between text-emerald-700"><span>Discount Coupon</span><b>-৳500</b></div>
            <div class="flex justify-between text-sm font-bold text-dark border-t border-gold/30 pt-2">
              <span>Total Amount</span><span class="text-deep text-lg">৳18,100</span>
            </div>
          </div>

          <button class="gbtn w-full py-3 rounded-full text-xs uppercase tracking-wider font-bold shadow mt-2">
            Place Order Now
          </button>
        </div>
      </div>

    </div>
  </main>

  <script>lucide.createIcons();</script>
</body>
</html>
