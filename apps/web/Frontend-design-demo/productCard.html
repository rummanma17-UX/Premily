<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card Component - Premily</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FAF3E8; /* Premily cream background */
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

  <!-- ==================== PRODUCT CARD START ==================== -->
  <div class="w-full max-w-[220px] sm:max-w-[240px] bg-white border border-[#EADFCD] rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-shadow duration-200">
    
    <!-- Image Container with Overlaid Discount Badge -->
    <div class="relative w-full aspect-[4/3] overflow-hidden bg-gray-100">
      <img 
        src="https://images.unsplash.com/photo-1517256064527-09c73fc73e38?auto=format&fit=crop&w=600&q=80" 
        alt="Aura Curved Lounge Chair" 
        class="w-full h-full object-cover"
      />
      <!-- Gold Discount Badge -->
      <span class="absolute top-2.5 left-2.5 bg-[#E3C793] text-[#1E1916] text-[11px] font-semibold italic px-2 py-0.5 rounded-full shadow-sm select-none">
        -23%
      </span>
    </div>

    <!-- Content Body -->
    <div class="p-3 flex flex-col gap-1.5">
      
      <!-- Product Title -->
      <h3 class="text-xs sm:text-sm font-medium text-[#1E1916] line-clamp-1 leading-snug">
        Aura Curved Lounge Chair
      </h3>

      <!-- Price Section -->
      <div class="flex items-baseline gap-2">
        <span class="text-sm sm:text-base font-bold text-[#B8924B]">৳18,500</span>
        <span class="text-xs text-[#68605B] line-through">৳24,000</span>
      </div>

      <!-- Badges Row -->
      <div class="flex items-center gap-1.5 pt-0.5">
        <!-- Mart Badge -->
        <span class="bg-[#1E1916] text-[#E3C793] text-[10px] font-semibold italic px-2 py-0.5 rounded select-none">
          Mart
        </span>
        <!-- Verified Badge -->
        <span class="bg-[#ECFDF5] text-[#047857] border border-[#A7F3D0] text-[10px] font-semibold italic px-2 py-0.5 rounded flex items-center gap-0.5 select-none">
          ✓Verified
        </span>
      </div>

      <!-- Rating & Sold Count -->
      <div class="text-[11px] text-[#68605B] font-normal pt-0.5">
        ★ 4.9 · 312 sold
      </div>

    </div>
  </div>
  <!-- ==================== PRODUCT CARD END ==================== -->

</body>
</html>
